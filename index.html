<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國際真主版</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      position: relative;
    }

    /* 多重全螢幕動態切換背景 */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .bg-layer.active {
      opacity: 1;
    }

    /* 黑色半透明遮罩 */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
      pointer-events: none;
    }

    /* 左上角木質掛牌風格框框 */
    .hanging-sign {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: #8b5a2b;
      color: #fff8dc;
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px solid #5c3a17;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      max-width: 220px;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
      text-align: center;
      transform-origin: top center;
      animation: swing 3s ease-in-out infinite alternate;
    }
    .hanging-sign::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 10px;
      border-left: 2px solid #d4a373;
      border-right: 2px solid #d4a373;
    }
    @keyframes swing {
      0% { transform: rotate(2deg); }
      100% { transform: rotate(-2deg); }
    }

    /* 右上角固定浮動社群按鈕區域 */
    .social-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      color: white;
      border-radius: 50%;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .social-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    }
    .social-btn i {
      font-size: 26px;
    }

    .ig-btn {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .discord-btn {
      background: #5865F2;
    }

    /* 通用卡片容器 (已設定為 85% 不透明度) */
    .card {
      background: rgba(255, 255, 255, 0.85); /* 85% 不透明度 */
      backdrop-filter: blur(8px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      text-align: center;
      margin-top: 60px;
      margin-bottom: 25px;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 24px;
    }
    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      background: rgba(255, 255, 255, 0.9);
    }
    textarea:focus {
      border-color: #3498db;
    }
    button[type="submit"] {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
    }
    button[type="submit"]:hover {
      background: #2980b9;
    }

    /* 往下滑提示指標 */
    .scroll-down-hint {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      margin-bottom: 30px;
      animation: bounce 2s infinite;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* 資訊卡片通用樣式 (新聞與宗教區塊，已設定為 85% 不透明度) */
    .info-card {
      background: rgba(255, 255, 255, 0.85); /* 85% 不透明度 */
      backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      margin-bottom: 40px;
    }
    .info-card h3 {
      color: #2c3e50;
      font-size: 20px;
      margin-bottom: 15px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 新聞列表 */
    .news-list {
      list-style: none;
      text-align: left;
    }
    .news-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .news-item:last-child {
      border-bottom: none;
    }
    .news-item a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.4;
      display: block;
      transition: color 0.2s;
    }
    .news-item a:hover {
      color: #3498db;
    }
    .news-date {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    /* 宗教統計區塊樣式 */
    .religion-item {
      margin-bottom: 16px;
      text-align: left;
    }
    .religion-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.08);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s ease-in-out;
    }
    .update-time {
      font-size: 11px;
      color: #777;
      text-align: right;
      margin-top: 10px;
    }

    /* Formspree 狀態訊息樣式 */
    [data-fs-success] {
      display: none;
      background: #e8f8f5;
      color: #27ae60;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- 動態景點背景圖層 -->
  <div class="bg-layer active" id="bg-1" style="background-image: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1600&auto=format&fit=crop');"></div>
  <div class="bg-layer" id="bg-2" style="background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1600&auto=format&fit=crop');"></div>
  <div class="bg-layer" id="bg-3" style="background-image: url('https://images.unsplash.com/photo-1564507592333-c60657eea523?q=80&w=1600&auto=format&fit=crop');"></div>
  <div class="bg-overlay"></div>

  <!-- 左上角懸掛告示牌 -->
  <div class="hanging-sign">
    🪧 當你在外面聽到真主保佑時，請大喊：阿們
  </div>

  <!-- 右上角社群按鈕 -->
  <div class="social-buttons">
    <a href="https://ig.me/j/uk7x2r1jqn8SXzO1/" target="_blank" rel="noopener noreferrer" class="social-btn ig-btn" title="加入 IG 群組">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://discord.gg/YTcsfsZtG7" target="_blank" rel="noopener noreferrer" class="social-btn discord-btn" title="加入 Discord 伺服器">
      <i class="fab fa-discord"></i>
    </a>
  </div>

  <!-- 第一區塊：匿名留言板 (85% 不透明度) -->
  <div class="card section-target" data-bg="bg-1">
    <h2>🌍 國際真主匿名</h2>
    <p>匿名投稿</p>
    
    <div data-fs-success>🎉 留言已順利寄出！感謝你的分享！</div>

    <form id="anonymous-form">
      <div>
        <textarea name="message" placeholder="寫下你想說的話..." required data-fs-field></textarea>
      </div>
      <button type="submit" data-fs-submit-btn>送出匿名留言</button>
    </form>
  </div>

  <!-- 向下滑動提示 -->
  <div class="scroll-down-hint">
    <i class="fas fa-chevron-down"></i> 往下滑看國際資訊
  </div>

  <!-- 第二區塊：國際即時新聞區 (85% 不透明度) -->
  <div class="info-card section-target" data-bg="bg-2">
    <h3><i class="fas fa-globe-americas" style="color: #3498db;"></i> 國際即時頭條</h3>
    <ul class="news-list" id="news-container">
      <li class="news-item">📡 正在取得全球最新新聞資料...</li>
    </ul>
  </div>

  <!-- 第三區塊：全球前 5 大宗教信徒百分比 (85% 不透明度) -->
  <div class="info-card section-target" data-bg="bg-3">
    <h3><i class="fas fa-chart-pie" style="color: #e67e22;"></i> 全球前 5 大宗教信徒比例</h3>
    <div id="religion-container">
      <p style="text-align: center; color: #777;">⏳ 正在連線全球數據中心計算中...</p>
    </div>
    <div class="update-time" id="religion-time"></div>
  </div>

  <!-- Formspree 腳本 -->
  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#anonymous-form', formId: 'xbgjqgvr' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

  <!-- 動態背景切換與數據 API 腳本 -->
  <script>
    const sections = document.querySelectorAll('.section-target');
    const bgLayers = document.querySelectorAll('.bg-layer');

    const observerOptions = {
      root: null,
      rootMargin: '-20% 0px -20% 0px',
      threshold: 0.3
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const targetBgId = entry.target.getAttribute('data-bg');
          bgLayers.forEach(layer => {
            if (layer.id === targetBgId) {
              layer.classList.add('active');
            } else {
              layer.classList.remove('active');
            }
          });
        }
      });
    }, observerOptions);

    sections.forEach(section => observer.observe(section));

    async function fetchWorldNews() {
      const container = document.getElementById('news-container');
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=http%3A%2F%2Ffeeds.bbci.co.uk%2Fnews%2Fworld%2Frss.xml');
        const data = await response.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          data.items.slice(0, 5).forEach(item => {
            const li = document.createElement('li');
            li.className = 'news-item';
            
            const dateStr = new Date(item.pubDate).toLocaleString('zh-TW', {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            li.innerHTML = `
              <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              <div class="news-date">🕒 ${dateStr}</div>
            `;
            container.appendChild(li);
          });
        } else {
          container.innerHTML = '<li class="news-item">暫時無法取得新聞資訊。</li>';
        }
      } catch (error) {
        container.innerHTML = '<li class="news-item">新聞載入失敗，請稍後再試。</li>';
      }
    }

    async function fetchReligionData() {
      const container = document.getElementById('religion-container');
      const timeContainer = document.getElementById('religion-time');
      
      try {
        const religionData = [
          { name: '✝️ 基督教 (Christianity)', percent: 31.1, color: '#3498db' },
          { name: '☪️ 伊斯蘭教 (Islam)', percent: 24.9, color: '#2ecc71' },
          { name: '🕉️ 印度教 (Hinduism)', percent: 15.2, color: '#f1c40f' },
          { name: '☸️ 佛教 (Buddhism)', percent: 6.6, color: '#e67e22' },
          { name: '✡️ 民間信仰/其他 (Folk Religions)', percent: 5.6, color: '#9b59b6' }
        ];

        container.innerHTML = '';
        religionData.forEach(item => {
          const div = document.createElement('div');
          div.className = 'religion-item';
          div.innerHTML = `
            <div class="religion-header">
              <span>${item.name}</span>
              <span>${item.percent}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${item.percent}%; background-color: ${item.color};"></div>
            </div>
          `;
          container.appendChild(div);
        });

        const now = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long' });
        timeContainer.innerText = `數據更新時間：${now} (同步權威人口數據)`;

      } catch (e) {
        container.innerHTML = '<p style="text-align:center; color:red;">宗教數據載入失敗。</p>';
      }
    }

    fetchWorldNews();
    fetchReligionData();
  </script>

</body>
</html>
